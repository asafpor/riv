<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סימון ריבים</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #4a6741 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { color: white; margin-bottom: 30px; font-size: 1.8em; }
        .login-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.1em;
            margin-bottom: 12px;
            text-align: center;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #4a6741;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
        }
        .panel { width: 100%; max-width: 500px; display: none; }
        .kid-btn {
            background: white;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
        }
        .kid-name { font-size: 1.4em; font-weight: 600; color: #333; }
        .kid-count { font-size: 1.8em; font-weight: 700; color: #e53935; min-width: 40px; text-align: center; }
        .kid-actions { display: flex; align-items: center; gap: 10px; }
        .minus-btn {
            background: #ffcdd2;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.2em;
            cursor: pointer;
            color: #c62828;
            font-weight: bold;
        }
        .plus-btn {
            background: #c8e6c9;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5em;
            cursor: pointer;
            color: #2e7d32;
            font-weight: bold;
        }
        .reset-section { margin-top: 30px; text-align: center; display: none; }
        .reset-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
        }
        nav { margin-top: 30px; display: flex; gap: 12px; }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 30px;
        }
        nav a:hover { background: white; color: #2c3e50; }
        .month-label { color: rgba(255,255,255,0.8); margin-bottom: 20px; font-size: 1.1em; }
        .disabled { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>
    <h1>סימון ריבים</h1>
    <div class="month-label" id="monthLabel"></div>

    <div class="login-box" id="loginBox">
        <p style="margin-bottom:16px;color:#666;">הכניסי סיסמה</p>
        <input type="password" id="passInput" placeholder="סיסמה">
        <button onclick="tryLogin()">כניסה</button>
    </div>

    <div class="panel" id="panel"></div>
    <div class="reset-section" id="resetSection">
        <button class="reset-btn" onclick="resetMonth()">איפוס חודש</button>
    </div>

    <nav>
        <a href="index.html">תוצאות</a>
        <a href="rules.html">חוקים</a>
    </nav>

    <script>
        // ===== שימי כאן את ה-URL של ה-Web App =====
        const API_URL = 'https://script.google.com/macros/s/AKfycbxBD423oLkosMZ2ono-b7e3d_fCTJcl_Ty-2m00cqCnz14PcJ2S2M7f1sY3ZxtLALyu/exec';

        const KIDS = ['דנ', 'אב', 'יר', 'ג'];
        const PASS = '2222';
        let currentData = {};

        function getCurrentMonth() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        }

        function getMonthLabel() {
            const now = new Date();
            const months = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
            return `${months[now.getMonth()]} ${now.getFullYear()}`;
        }

        function tryLogin() {
            if (document.getElementById('passInput').value === PASS) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('panel').style.display = 'block';
                document.getElementById('resetSection').style.display = 'block';
                loadAndRender();
            } else {
                alert('סיסמה שגויה');
            }
        }

        document.getElementById('passInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') tryLogin();
        });

        async function loadAndRender() {
            const res = await fetch(`${API_URL}?month=${getCurrentMonth()}`, { redirect: 'follow' });
            const text = await res.text();
            currentData = JSON.parse(text);
            renderPanel();
        }

        async function sendAction(action, name) {
            document.getElementById('panel').classList.add('disabled');
            const url = `${API_URL}?action=${action}&name=${encodeURIComponent(name)}&month=${getCurrentMonth()}`;
            await fetch(url, { redirect: 'follow' });
            await loadAndRender();
            document.getElementById('panel').classList.remove('disabled');
        }

        async function resetMonth() {
            if (confirm('בטוח לאפס את החודש?')) {
                await sendAction('reset', '');
            }
        }

        function renderPanel() {
            let html = '';
            KIDS.forEach(name => {
                const count = currentData[name] || 0;
                html += `
                    <div class="kid-btn">
                        <span class="kid-name">${name}</span>
                        <div class="kid-actions">
                            <button class="minus-btn" onclick="sendAction('remove','${name}')">-</button>
                            <span class="kid-count">${count}</span>
                            <button class="plus-btn" onclick="sendAction('add','${name}')">+</button>
                        </div>
                    </div>`;
            });
            document.getElementById('panel').innerHTML = html;
        }

        document.getElementById('monthLabel').textContent = getMonthLabel();
    </script>
</body>
</html>
